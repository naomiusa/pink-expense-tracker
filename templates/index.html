
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pink Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --pink: #e75480;
            --pink-dark: #c93668;
            --pink-light: #fff0f6;
            --pink-border: #ffd0e2;
            --text: #49313b;
            --muted: #927b85;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 30px 20px 50px;
            background: #fff5f8;
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .top-bar {
            position: relative;
            max-width: 1000px;
            margin: 0 auto 35px;
            text-align: center;
        }

        .top-bar h1 {
            color: #d63384;
            font-size: clamp(26px, 5vw, 38px);
            margin: 10px 0;
        }

        .subtitle {
            color: #80616f;
            font-size: 16px;
            margin: 10px 0 0;
        }

        button {
            background: var(--pink);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: var(--pink-dark);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .logout-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #8c5269;
        }

        .logout-button:hover {
            background: #704052;
        }

        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-card {
            background: var(--white);
            border: 1px solid var(--pink-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 6px 22px rgba(214, 51, 132, 0.06);
        }

        h2 {
            color: #c4457c;
            font-size: 22px;
            margin: 0 0 20px;
        }

        .budget-form,
        .expense-form {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        input {
            background: #fffafd;
            color: var(--text);
            border: 1px solid #f0b6ce;
            border-radius: 11px;
            padding: 13px 15px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(231, 84, 128, 0.12);
        }

        .budget-form input {
            width: 260px;
        }

        .expense-form input:first-child {
            flex: 1;
            min-width: 180px;
        }

        .expense-form input:nth-child(2) {
            width: 180px;
        }

        #budgetMessage {
            margin: 18px 0 0;
            color: #8c5269;
            font-size: 14px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: linear-gradient(135deg, #fff0f6, #fff8fb);
            border: 1px solid #ffc1dc;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.08);
        }

        .summary-label {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 10px;
        }

        .summary-value {
            color: #d63384;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: bold;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .expenses-card h2 {
            margin-bottom: 18px;
        }

        #expenseList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #expenseList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #fffafd;
            border: 1px solid #f8d5e4;
            border-radius: 13px;
            padding: 15px 17px;
            margin: 10px 0;
        }

        .expense-details {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .expense-name {
            font-weight: 600;
            color: var(--text);
        }

        .expense-date {
            color: var(--muted);
            font-size: 13px;
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .expense-amount {
            color: #c4457c;
            font-weight: bold;
            white-space: nowrap;
        }

        .delete-button {
            background: #f4dce6;
            color: #9b4568;
            padding: 9px 14px;
            font-size: 13px;
        }

        .delete-button:hover {
            background: #edc3d5;
        }

        #emptyMessage {
            background: #fffafd;
            border: 1px dashed #f0b6ce;
            border-radius: 13px;
            padding: 25px 15px;
            color: var(--muted);
            margin: 0;
        }

        @media screen and (max-width: 650px) {
            body {
                padding: 20px 14px 35px;
            }

            .top-bar {
                padding-bottom: 45px;
                margin-bottom: 20px;
            }

            .top-bar h1 {
                font-size: 27px;
                padding: 0 5px;
            }

            .subtitle {
                font-size: 14px;
                line-height: 1.5;
            }

            .logout-button {
                top: auto;
                right: 50%;
                bottom: 0;
                transform: translateX(50%);
            }

            .section-card {
                padding: 20px 16px;
                border-radius: 17px;
            }

            h2 {
                font-size: 20px;
            }

            .budget-form,
            .expense-form {
                flex-direction: column;
                align-items: stretch;
            }

            .budget-form input,
            .expense-form input,
            .expense-form input:first-child,
            .expense-form input:nth-child(2) {
                width: 100%;
                min-width: 0;
            }

            .budget-form button,
            .expense-form button {
                width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .summary-card {
                padding: 18px;
            }

            #expenseList li {
                align-items: flex-start;
                padding: 13px;
            }

            .expense-right {
                flex-direction: column;
                align-items: flex-end;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <h1>🎀 My Expense Tracker 🎀</h1>
        <p class="subtitle">Take control of your money, one expense at a time.</p>
        <button class="logout-button" onclick="logout()">Logout</button>
    </header>

    <main class="dashboard">

        <section class="section-card">
            <h2>Monthly Budget</h2>

            <div class="budget-form">
                <input
                    type="number"
                    id="budget"
                    placeholder="Enter your monthly budget"
                    min="0.01"
                    step="0.01"
                >

                <button onclick="setBudget()">Set Budget</button>
            </div>

            <p id="budgetMessage">Please set your monthly budget.</p>
        </section>

        <section class="section-card">
            <h2>Add an Expense</h2>

            <div class="expense-form">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount (₦)"
                    min="0.01"
                    step="0.01"
                >

                <button onclick="addExpense()">Add Expense</button>
            </div>
        </section>

        <section class="summary-grid">
            <div class="summary-card">
                <p class="summary-label">Total Spent</p>
                <p class="summary-value">₦<span id="totalSpent">0</span></p>
            </div>

            <div class="summary-card">
                <p class="summary-label">Remaining Budget</p>
                <p class="summary-value">₦<span id="remainingBudget">0</span></p>
            </div>
        </section>

        <section class="section-card expenses-card">
            <h2>My Expenses</h2>

            <ul id="expenseList"></ul>

            <p id="emptyMessage">Your expenses will appear here.</p>
        </section>

    </main>

    <script>
        let budget = 0;
        let expenses = [];

        function updateSummary() {
            const total = expenses.reduce(function(sum, expense) {
                return sum + Number(expense.amount);
            }, 0);

            document.getElementById("totalSpent").textContent =
                total.toLocaleString("en-NG");

            document.getElementById("remainingBudget").textContent =
                (budget - total).toLocaleString("en-NG");

            const message = document.getElementById("budgetMessage");

            if (budget > 0 && total > budget) {
                message.textContent =
                    "Warning! You have exceeded your budget!";
            } else if (budget > 0) {
                message.textContent = "You're within your budget!";
            } else {
                message.textContent = "Please set your monthly budget.";
            }
        }

        async function loadBudget() {
            const response = await fetch("/budget");

            if (!response.ok) {
                throw new Error("Could not load your budget.");
            }

            const data = await response.json();

            budget = Number(data.budget) || 0;

            document.getElementById("budget").value =
                budget > 0 ? budget : "";

            updateSummary();
        }

        async function setBudget() {
            const input = document.getElementById("budget");
            const amount = Number(input.value);

            if (!Number.isFinite(amount) || amount <= 0) {
                document.getElementById("budgetMessage").textContent =
                    "Please enter a valid budget.";
                return;
            }

            try {
                const response = await fetch("/budget", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ budget: amount })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not save budget.");
                }

                budget = Number(data.budget);
                updateSummary();

                document.getElementById("budgetMessage").textContent =
                    "Your monthly budget has been saved!";
            } catch (error) {
                document.getElementById("budgetMessage").textContent =
                    error.message;
            }
        }

        async function loadExpenses() {
            const response = await fetch("/expenses");

            if (!response.ok) {
                throw new Error("Could not load your expenses.");
            }

            expenses = await response.json();

            renderExpenses();
        }

        function renderExpenses() {
            const expenseList = document.getElementById("expenseList");

            expenseList.innerHTML = "";

            expenses.forEach(function(expense) {
                const item = document.createElement("li");

                const details = document.createElement("div");
                details.className = "expense-details";

                const name = document.createElement("span");
                name.className = "expense-name";
                name.textContent = expense.name;

                const date = document.createElement("span");
                date.className = "expense-date";
                date.textContent = expense.date || "Date unavailable";

                details.appendChild(name);
                details.appendChild(date);

                const right = document.createElement("div");
                right.className = "expense-right";

                const amount = document.createElement("span");
                amount.className = "expense-amount";
                amount.textContent =
                    "₦" + Number(expense.amount).toLocaleString("en-NG");

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {
                    deleteExpense(expense.id);
                };

                right.appendChild(amount);
                right.appendChild(deleteButton);

                item.appendChild(details);
                item.appendChild(right);

                expenseList.appendChild(item);
            });

            document.getElementById("emptyMessage").style.display =
                expenses.length === 0 ? "block" : "none";

            updateSummary();
        }

        async function addExpense() {
            const nameInput = document.getElementById("expenseName");
            const amountInput = document.getElementById("expenseAmount");

            const name = nameInput.value.trim();
            const amount = Number(amountInput.value);

            if (!name || !Number.isFinite(amount) || amount <= 0) {
                alert("Please enter an expense name and a valid amount.");
                return;
            }

            try {
                const response = await fetch("/add_expense", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        amount: amount,
                        date: new Date().toLocaleDateString("en-NG")
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not add expense.");
                }

                nameInput.value = "";
                amountInput.value = "";

                await loadExpenses();

            } catch (error) {
                alert(error.message);
            }
        }

        async function deleteExpense(id) {
            try {
                const response = await fetch(
                    `/delete_expense/${id}`,
                    { method: "DELETE" }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not delete expense.");
                }

                await loadExpenses();

            } catch (error) {
                alert(error.message);
            }
        }

        function logout() {
            window.location.href = "/logout";
        }

        async function initializeTracker() {
            try {
                await loadBudget();
                await loadExpenses();
            } catch (error) {
                alert(error.message);
            }
        }

        initializeTracker();
    </script>

</body>
</html>
