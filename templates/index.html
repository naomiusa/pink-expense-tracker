
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pink Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #fff5f8;
            font-family: Arial, sans-serif;
            color: #4a3039;
            text-align: center;
            padding: 30px;
            margin: 0;
        }

        h1 {
            color: #d63384;
            font-size: clamp(26px, 5vw, 36px);
        }

        h2 {
            color: #c4457c;
            margin-top: 35px;
        }

        input {
            padding: 12px;
            margin: 8px;
            border: 1px solid #f0b6ce;
            border-radius: 10px;
            max-width: 100%;
        }

        button {
            background-color: #e75480;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #c93668;
        }

        .logout-button {
            background-color: #8c5269;
        }

        .summary-card {
            background: #fff0f6;
            border: 2px solid #ffc1dc;
            border-radius: 18px;
            padding: 10px;
            margin: 10px auto;
            width: 250px;
            max-width: 100%;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
        }

        .summary-card p {
            color: #d63384;
            font-size: 17px;
            font-weight: bold;
            margin: 5px 0;
        }

        #expenseList {
            list-style: none;
            padding: 0;
            max-width: 500px;
            margin: 15px auto;
        }

        #expenseList li {
            background: white;
            border: 1px solid #ffc1dc;
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
            overflow-wrap: anywhere;
        }

        @media screen and (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 21px;
                margin-top: 25px;
            }

            input {
                width: 100%;
                margin: 8px 0;
            }

            button {
                max-width: 100%;
            }

            .summary-card {
                width: 100%;
            }
        }
.top-bar {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}

.top-bar h1 {
    margin: 10px 0;
}

.top-bar .logout-button {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
}

@media screen and (max-width: 600px) {
    .top-bar {
        padding-bottom: 45px;
    }

    .top-bar .logout-button {
        top: auto;
        right: 50%;
        bottom: 0;
        transform: translateX(50%);
    }
}
    </style>
</head>

<body>

   <div class="top-bar">
    <h1>🎀My Expense Tracker🎀</h1>
    <button class="logout-button" onclick="logout()">Logout</button>
</div>

<p>Take control of your money, one expense at a time.</p>

    <h2>Monthly Budget</h2>

    <input
        type="number"
        id="budget"
        placeholder="Enter your monthly budget"
        min="0.01"
        step="0.01"
    >

    <button onclick="setBudget()">Set Budget</button>

    <p id="budgetMessage"></p>

    <h2>Add an Expense</h2>

    <input type="text" id="expenseName" placeholder="Expense name">

    <input
        type="number"
        id="expenseAmount"
        placeholder="Amount"
        min="0.01"
        step="0.01"
    >

    <button onclick="addExpense()">Add Expense</button>

    <p class="summary-card">
        Total Spent: ₦<span id="totalSpent">0</span>
    </p>

    <p class="summary-card">
        Remaining Budget: ₦<span id="remainingBudget">0</span>
    </p>

    <h2>My Expenses</h2>

    <ul id="expenseList"></ul>

    <p id="emptyMessage">Your expenses will appear here.</p>

    <script>
        let budget = 0;
        let expenses = [];

        function updateSummary() {
            const total = expenses.reduce(function(sum, expense) {
                return sum + Number(expense.amount);
            }, 0);

            document.getElementById("totalSpent").textContent =
                total.toLocaleString("en-NG");

            document.getElementById("remainingBudget").textContent =
                (budget - total).toLocaleString("en-NG");

            const message = document.getElementById("budgetMessage");

            if (budget > 0 && total > budget) {
                message.textContent =
                    "Warning! You have exceeded your budget!";
            } else if (budget > 0) {
                message.textContent = "You're within your budget!";
            } else {
                message.textContent = "Please set your monthly budget.";
            }
        }

        async function loadBudget() {
            const response = await fetch("/budget");

            if (!response.ok) {
                throw new Error("Could not load your budget.");
            }

            const data = await response.json();

            budget = Number(data.budget) || 0;

            document.getElementById("budget").value =
                budget > 0 ? budget : "";

            updateSummary();
        }

        async function setBudget() {
            const input = document.getElementById("budget");
            const amount = Number(input.value);

            if (!Number.isFinite(amount) || amount <= 0) {
                document.getElementById("budgetMessage").textContent =
                    "Please enter a valid budget.";
                return;
            }

            try {
                const response = await fetch("/budget", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ budget: amount })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not save budget.");
                }

                budget = Number(data.budget);
                updateSummary();

                document.getElementById("budgetMessage").textContent =
                    "Your monthly budget has been saved!";
            } catch (error) {
                document.getElementById("budgetMessage").textContent =
                    error.message;
            }
        }

        async function loadExpenses() {
            const response = await fetch("/expenses");

            if (!response.ok) {
                throw new Error("Could not load your expenses.");
            }

            expenses = await response.json();

            renderExpenses();
        }

        function renderExpenses() {
            const expenseList = document.getElementById("expenseList");

            expenseList.innerHTML = "";

            expenses.forEach(function(expense) {
                const item = document.createElement("li");

                item.appendChild(
                    document.createTextNode(
                        expense.name + " - ₦" +
                        Number(expense.amount).toLocaleString("en-NG") +
                        " - " + (expense.date || "Date unavailable") + " "
                    )
                );

                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {
                    deleteExpense(expense.id);
                };

                item.appendChild(deleteButton);
                expenseList.appendChild(item);
            });

            document.getElementById("emptyMessage").style.display =
                expenses.length === 0 ? "block" : "none";

            updateSummary();
        }

        async function addExpense() {
            const nameInput = document.getElementById("expenseName");
            const amountInput = document.getElementById("expenseAmount");

            const name = nameInput.value.trim();
            const amount = Number(amountInput.value);

            if (!name || !Number.isFinite(amount) || amount <= 0) {
                alert("Please enter an expense name and a valid amount.");
                return;
            }

            try {
                const response = await fetch("/add_expense", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        amount: amount,
                        date: new Date().toLocaleDateString("en-NG")
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not add expense.");
                }

                nameInput.value = "";
                amountInput.value = "";

                await loadExpenses();

            } catch (error) {
                alert(error.message);
            }
        }

        async function deleteExpense(id) {
            try {
                const response = await fetch(
                    `/delete_expense/${id}`,
                    { method: "DELETE" }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Could not delete expense.");
                }

                await loadExpenses();

            } catch (error) {
                alert(error.message);
            }
        }

        function logout() {
            window.location.href = "/logout";
        }

        async function initializeTracker() {
            try {
                await loadBudget();
                await loadExpenses();
            } catch (error) {
                alert(error.message);
            }
        }

        initializeTracker();
    </script>

</body>
</html>
