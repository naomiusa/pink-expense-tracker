
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f5f0e7;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: #292820;
        }

        .auth-card {
            background: #ffffff;
            max-width: 380px;
            margin: auto;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(85, 76, 62, 0.10);
        }

        h1, h2 {
            color: #554c3e;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 0;
            border: 1px solid #e5ded1;
            border-radius: 10px;
            background: #faf8f3;
            color: #292820;
        }

        input:focus {
            outline: 1px solid #8b806b;
            border-color: #8b806b;
        }

        .password-field {
            position: relative;
            width: 100%;
            margin: 15px auto;
        }

        .password-field input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: #554c3e;
            border: none;
            padding: 5px;
            cursor: pointer;
            font-size: 17px;
        }

        .toggle-password:hover {
            background: transparent;
        }

        form > input {
            margin: 15px auto;
        }

        button[type="submit"] {
            background: #554c3e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 5px;
        }

        button[type="submit"]:hover {
            background: #3f392f;
        }

        a {
            color: #554c3e;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h1>My Expense Tracker</h1>

        {% if action == "register" %}
            <h2>Create Account</h2>
            <form method="POST">
                <input type="text" name="username" placeholder="Choose a username" required>

                <div class="password-field">
                    <input type="password" name="password" id="registerPassword" placeholder="Create a password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">👁</button>
                </div>

                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="/login">Login</a></p>

        {% else %}
            <h2>Welcome Back!</h2>
            <form method="POST">
                <input type="text" name="username" placeholder="Username" required>

                <div class="password-field">
                    <input type="password" name="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁</button>
                </div>

                <button type="submit">Login</button>
            </form>
            <p>New here? <a href="/register">Create an account</a></p>
        {% endif %}
    </div>

    <script>
        function togglePassword(id, button) {
            const password = document.getElementById(id);

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "🙈";
            } else {
                password.type = "password";
                button.textContent = "👁";
            }
        }
    </script>
</body>
</html>
